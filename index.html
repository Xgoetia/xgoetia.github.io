<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xgoetia | Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="modulepreload" href="/pkg/my_wasm_project.js">
    <link rel="preload" href="/pkg/my_wasm_project_bg.wasm" as="fetch" type="application/wasm" crossorigin>
    <style>
:root {
    --section-color: #ff4500;
    --color-hero: #ff4500;
    --color-overview: #7a00ff;
    --color-profile: #00d4ff;
    --color-tools: #00c853;
    --color-bundler: #ff6d00;
    --color-connect: #e91e63;
}
        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0; background: #fff; color: #1a1a1a;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden; overflow-y: auto;
            cursor: none !important;
        }
        html { scroll-behavior: smooth; }
        * { cursor: none !important; }
        @supports not (color: color-mix(in srgb, red, blue)) {
            .tech-card, .pro-tool-card, .skill-tags span, .app-item,
            .contact-item, .bundler-actions button, .bundler-presets button,
            .project-card, .project-tech span { background: rgba(0,0,0,0.04) !important; border-color: rgba(0,0,0,0.1) !important; }
            .tech-card:hover, .project-card:hover { box-shadow: none !important; }
            .profile-bio { background: rgba(0,0,0,0.03) !important; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
            .custom-cursor { display: none !important; }
            body, * { cursor: auto !important; }
        }
        @media (prefers-reduced-transparency: reduce) {
            .page-content, .sidebar-menu { background: rgba(255,255,255,0.96) !important; backdrop-filter: none !important; }
        }

        :focus-visible { outline: 2px solid var(--section-color); outline-offset: 4px; border-radius: 4px; }

        /* LOADING */
        .loading-screen {
            position: fixed; inset: 0; background: #fff; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-family: 'Courier New', monospace; color: var(--color-hero);
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        .loading-screen.done { opacity: 0; visibility: hidden; pointer-events: none; }
        .loading-screen .spinner { width: 18px; height: 18px; margin-top: 14px; border: 2px solid rgba(0,0,0,0.06); border-top-color: var(--color-hero); border-radius: 50%; animation: lspin 0.7s linear infinite; }
        .loading-screen .lbar { width: 120px; height: 2px; margin-top: 12px; background: rgba(0,0,0,0.04); border-radius: 2px; overflow: hidden; }
        .loading-screen .lbar span { display: block; height: 100%; width: 0%; background: var(--color-hero); border-radius: 2px; }
        @keyframes lspin { to { transform: rotate(360deg); } }

        /* CANVAS */
        #hero { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
        canvas { display: block; width: 100vw; height: 100vh; }

        /* SECTIONS */
        #sections { position: relative; z-index: 2; }
        .section-marker { height: 100vh; pointer-events: none; }

        /* SCROLL PROGRESS */
        #scroll-progress {
            position: fixed; top: 0; left: 0; height: 3px; z-index: 1001;
            background: linear-gradient(90deg, var(--color-hero), var(--color-overview), var(--color-profile), var(--color-tools), var(--color-bundler), var(--color-connect));
            width: 0%; transition: width 0.1s linear;
        }

        /* SCROLL HINT */
        .scroll-hint {
            position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
            z-index: 15; color: rgba(0,0,0,0.25); font-family: monospace; font-size: 10px;
            letter-spacing: 3px; opacity: 0; transition: opacity 0.6s;
        }
        .scroll-hint.visible { opacity: 1; }
        .scroll-hint span { display: block; width: 1px; height: 24px; margin: 6px auto 0; background: rgba(0,0,0,0.15); animation: shint 1.8s infinite; }
        @keyframes shint { 0%,100% { transform: scaleY(0.3); opacity: 0.3; } 50% { transform: scaleY(1); opacity: 1; } }

        /* SECTION TITLE */
        .section-title {
            position: fixed; z-index: 3; pointer-events: none;
            font-weight: 900; font-size: clamp(48px, 10vw, 140px);
            color: transparent; -webkit-text-stroke: 1px rgba(0,0,0,0.04);
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            opacity: 0; letter-spacing: -0.04em;
            white-space: nowrap; text-transform: uppercase;
        }
        .section-title.active { opacity: 0.35; -webkit-text-stroke: 1px var(--section-color); }

        /* BOTTOM NAV */
        .bottom-bar {
            animation: bottomBarUp 0.8s 0.5s cubic-bezier(0.165, 0.84, 0.44, 1) both;
        }
        @keyframes bottomBarUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .bottom-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            z-index: 1000;
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 40px 18px;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-top: 1px solid rgba(0,0,0,0.04);
            font-family: 'Courier New', monospace;
            font-size: 11px; letter-spacing: 1.5px;
            text-transform: uppercase;
            user-select: none;
        }
        .bottom-bar .logo {
            font-family: 'Inter', sans-serif;
            font-weight: 900; font-size: 20px;
            letter-spacing: 5px;
            color: transparent;
            -webkit-text-stroke: 1.5px var(--section-color);
            transition: color 0.3s, -webkit-text-stroke 0.3s;
        }
        @supports not (color: transparent) {
            .bottom-bar .logo { color: var(--section-color); }
        }
        /* ===== NAV LINK — Premium Pill Design ===== */
        .bottom-nav-links {
            display: flex; gap: 3px; align-items: center;
            padding: 3px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(12px) saturate(1.2);
            -webkit-backdrop-filter: blur(12px) saturate(1.2);
            border-radius: 100px;
            border: 1px solid rgba(255,255,255,0.25);
        }
        .bottom-nav-links a {
            position: relative;
            padding: 6px 16px;
            color: rgba(0,0,0,0.15);
            text-decoration: none;
            font-family: 'Inter', 'Courier New', monospace;
            font-size: 10px; letter-spacing: 2px;
            font-weight: 600;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            border-radius: 100px;
            z-index: 1;
            white-space: nowrap;
            animation: navFadeIn 0.6s cubic-bezier(0.165, 0.84, 0.44, 1) both;
        }
        .bottom-nav-links a:nth-child(1) { animation-delay: 0.5s; }
        .bottom-nav-links a:nth-child(2) { animation-delay: 0.6s; }
        .bottom-nav-links a:nth-child(3) { animation-delay: 0.7s; }
        .bottom-nav-links a:nth-child(4) { animation-delay: 0.8s; }
        .bottom-nav-links a:nth-child(5) { animation-delay: 0.9s; }
        .bottom-nav-links a:nth-child(6) { animation-delay: 1.0s; }
        @keyframes navFadeIn {
            from { opacity: 0; transform: translateY(10px) scale(0.92); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        /* Glass pill background — grows from center */
        .bottom-nav-links a::before {
            content: '';
            position: absolute; inset: 0;
            border-radius: 100px;
            background: var(--section-color);
            transform: scaleX(0.7) scaleY(0);
            opacity: 0;
            transition: all 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: -1;
        }
        .bottom-nav-links a:hover::before {
            transform: scaleX(1) scaleY(1);
            opacity: 0.08;
        }
        .bottom-nav-links a.active::before {
            transform: scaleX(1) scaleY(1);
            opacity: 1;
            box-shadow: 0 2px 20px color-mix(in srgb, var(--section-color) 35%, transparent),
                        0 4px 8px color-mix(in srgb, var(--section-color) 15%, transparent);
        }
        .bottom-nav-links a:hover {
            color: var(--section-color);
            letter-spacing: 2.5px;
        }
        .bottom-nav-links a.active {
            color: #fff;
            padding-left: 20px;
            padding-right: 20px;
            font-weight: 700;
        }
        /* Divider dots */
        .nav-divider {
            color: rgba(0,0,0,0.08);
            font-size: 8px;
            pointer-events: none;
            transition: opacity 0.3s, transform 0.3s;
            user-select: none;
        }
        a:hover + .nav-divider,
        .nav-divider:hover {
            opacity: 0;
            transform: scale(0.5);
        }
        /* Link ID — circular badge */
        .bottom-nav-links a .link-id {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 6px; font-weight: 800;
            color: var(--section-color);
            background: color-mix(in srgb, var(--section-color) 12%, transparent);
            width: 15px; height: 15px;
            border-radius: 50%;
            margin-right: 5px;
            transition: all 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
            vertical-align: middle;
            letter-spacing: 0;
        }
        .bottom-nav-links a:hover .link-id {
            background: color-mix(in srgb, var(--section-color) 22%, transparent);
            transform: scale(1.15) rotate(-5deg);
            color: var(--section-color);
        }
        .bottom-nav-links a.active .link-id {
            background: rgba(255,255,255,0.2);
            color: #fff;
            transform: scale(1);
        }
        /* Underline sweep — center outward on hover */
        .bottom-nav-links a::after {
            content: '';
            position: absolute;
            bottom: 4px;
            left: 50%; right: 50%;
            height: 1.5px;
            background: var(--section-color);
            border-radius: 3px;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .bottom-nav-links a:hover::after {
            left: 14px; right: 14px;
            opacity: 0.6;
        }
        .bottom-nav-links a.active::after {
            display: none;
        }
        .bottom-lang {
            display: flex; gap: 8px; align-items: center;
            font-size: 9px; letter-spacing: 2px;
        }
        .bottom-lang .lang-link {
            color: rgba(0,0,0,0.25);
            text-decoration: none; cursor: pointer;
            transition: all 0.3s;
            padding: 3px 6px; border-radius: 4px;
        }
        .bottom-lang .lang-link.active {
            color: var(--section-color); font-weight: 700;
            background: color-mix(in srgb, var(--section-color) 10%, transparent);
        }
        .bottom-lang .sep { color: rgba(0,0,0,0.1); }

        /* PAGE CONTENT */
        .page-content {
            position: fixed; top: 60px; right: 3%; width: 46%; max-width: 720px;
            max-height: 85vh; overflow-y: auto; color: #1a1a1a; padding: 36px;
            background: rgba(255,255,255,0.1); backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid color-mix(in srgb, var(--section-color) 15%, transparent);
            border-radius: 20px; z-index: 20;
            display: none; opacity: 0;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 25px 60px rgba(0,0,0,0.04);
            cursor: move; user-select: none;
        }
        .page-content.active { display: block; opacity: 1; }
        .page-content::-webkit-scrollbar { width: 4px; }
        .page-content::-webkit-scrollbar-thumb { background: var(--section-color); border-radius: 4px; }
        .page-content::-webkit-scrollbar-track { background: transparent; }

        .close-btn {
            position: sticky; top: 0; float: right;
            width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
            font-size: 16px; color: var(--section-color); cursor: pointer;
            border: none; background: rgba(255,255,255,0.5); border-radius: 50%;
            transition: all 0.3s; z-index: 1;
        }
        .close-btn:hover { background: var(--section-color); color: #fff; transform: rotate(90deg); }

        #content-area h1 { color: var(--section-color); font-family: 'Courier New', monospace; border-bottom: 2px solid var(--section-color); padding-bottom: 10px; margin-top: 0; font-size: 20px; }
        #content-area p { line-height: 1.7; color: #444; font-size: 14px; }

        /* TECH GRID */
        .tech-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin: 16px 0; }
        .tech-card {
            padding: 16px; border-radius: 12px;
            background: color-mix(in srgb, var(--section-color) 5%, transparent);
            border: 1px solid color-mix(in srgb, var(--section-color) 10%, transparent);
            text-align: center; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: card-in 0.4s ease-out both;
        }
        .tech-card:hover { transform: translateY(-4px) scale(1.03); box-shadow: 0 8px 25px color-mix(in srgb, var(--section-color) 15%, transparent); }
        .tech-card .icon { font-size: 28px; margin-bottom: 6px; display: block; }
        .tech-card .name { font-family: 'Courier New', monospace; font-size: 11px; font-weight: 600; color: #000; }
        .tech-card .desc { font-size: 10px; color: #666; margin-top: 4px; line-height: 1.4; }

        /* PROFILE */
        .profile-header { display: flex; gap: 20px; align-items: center; margin-bottom: 24px; flex-wrap: wrap; }
        .profile-avatar {
            width: 72px; height: 72px; border-radius: 50%;
            background: linear-gradient(135deg, var(--section-color), rgba(255,255,255,0.9) 60%);
            background: linear-gradient(135deg, var(--section-color), color-mix(in srgb, var(--section-color) 60%, #fff));
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; color: #fff; font-weight: 900;
            box-shadow: 0 4px 20px color-mix(in srgb, var(--section-color) 25%, transparent);
            flex-shrink: 0;
        }
        .profile-info h2 { margin: 0; font-family: 'Courier New', monospace; font-size: 18px; color: #000; }
        .profile-info .title { font-size: 12px; color: var(--section-color); font-weight: 500; margin-top: 2px; }
        .profile-info .loc { font-size: 10px; color: #888; margin-top: 2px; }
        .profile-bio { font-size: 13px; line-height: 1.7; color: #555; padding: 14px 18px; background: color-mix(in srgb, var(--section-color) 4%, transparent); border-radius: 10px; border-left: 3px solid var(--section-color); margin-bottom: 20px; }
        .skill-group { margin-bottom: 16px; animation: card-in 0.4s ease-out both; }
        .skill-group h4 { font-family: 'Courier New', monospace; font-size: 11px; color: var(--section-color); margin: 0 0 8px; letter-spacing: 1px; }
        .skill-bar { height: 20px; background: rgba(0,0,0,0.04); border-radius: 10px; overflow: hidden; position: relative; margin-bottom: 4px; }
        .skill-bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--section-color), color-mix(in srgb, var(--section-color) 70%, #fff)); border-radius: 10px; width: 0%; transition: width 1s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .skill-bar .label { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 9px; font-family: 'Courier New', monospace; color: #fff; font-weight: 600; text-shadow: 0 1px 4px rgba(0,0,0,0.3); white-space: nowrap; }
        .skill-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
        .skill-tags span { padding: 2px 10px; font-size: 9px; font-family: 'Courier New', monospace; background: color-mix(in srgb, var(--section-color) 8%, transparent); color: var(--section-color); border-radius: 20px; border: 1px solid color-mix(in srgb, var(--section-color) 15%, transparent); }

        /* CONNECT */
        .contact-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
        .contact-item {
            display: flex; align-items: center; gap: 14px;
            padding: 14px 18px; border-radius: 12px;
            background: color-mix(in srgb, var(--section-color) 4%, transparent);
            border: 1px solid color-mix(in srgb, var(--section-color) 10%, transparent);
            text-decoration: none; color: #1a1a1a;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: card-in 0.4s ease-out both;
        }
        .contact-item:hover { transform: translateX(6px); background: color-mix(in srgb, var(--section-color) 8%, transparent); border-color: color-mix(in srgb, var(--section-color) 25%, transparent); }
        .contact-item .ci-icon { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--section-color); color: #fff; font-size: 14px; font-weight: 700; flex-shrink: 0; }
        .contact-item .ci-label { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 1px; font-family: 'Courier New', monospace; }
        .contact-item .ci-value { font-size: 13px; font-weight: 500; }
        .terminal-line { font-family: 'Courier New', monospace; font-size: 12px; color: var(--section-color); padding: 2px 0; }
        .terminal-line .prompt { opacity: 0.6; }
        .terminal-line .cursor-bl { display: inline-block; width: 6px; height: 14px; background: var(--section-color); animation: blink 0.7s infinite; margin-left: 2px; vertical-align: middle; }

        /* BUNDLER */
        .bundler-presets { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 16px; }
        .bundler-presets button { background: color-mix(in srgb, var(--section-color) 8%, transparent); color: var(--section-color); border: 1px solid color-mix(in srgb, var(--section-color) 20%, transparent); padding: 6px 14px; border-radius: 8px; font-size: 10px; font-family: 'Courier New', monospace; cursor: pointer; transition: all 0.3s; }
        .bundler-presets button:hover { background: var(--section-color); color: #fff; }
        .bundler-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
        .bundler-header .stats { text-align: right; }
        .bundler-header .stats .count { color: var(--section-color); font-family: 'Courier New', monospace; font-weight: 700; font-size: 14px; display: block; }
        .bundler-header .stats .size { color: #888; font-size: 10px; }
        .bundler-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
        .bundler-actions button { background: color-mix(in srgb, var(--section-color) 8%, transparent); color: var(--section-color); border: 1px solid color-mix(in srgb, var(--section-color) 15%, transparent); padding: 6px 12px; border-radius: 8px; font-size: 9px; font-family: 'Courier New', monospace; cursor: pointer; transition: all 0.3s; }
        .bundler-actions button:hover { background: var(--section-color); color: #fff; }
        .bundler-actions button.primary { background: var(--section-color); color: #fff; }
        .bundler-actions button.primary:hover { filter: brightness(0.85); }

        #apps-list { max-height: 280px; overflow-y: auto; margin-bottom: 12px; }
        #apps-list::-webkit-scrollbar { width: 4px; }
        #apps-list::-webkit-scrollbar-thumb { background: var(--section-color); border-radius: 4px; }
        .app-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; margin-bottom: 4px; background: color-mix(in srgb, var(--section-color) 3%, transparent); border-radius: 8px; border: 1px solid color-mix(in srgb, var(--section-color) 6%, transparent); transition: background 0.2s; }
        .app-item:hover { background: color-mix(in srgb, var(--section-color) 6%, transparent); }
        .app-item input[type="checkbox"] { transform: scale(1.1); cursor: pointer; accent-color: var(--section-color); }
        .app-item .ai-name { font-weight: 600; font-size: 12px; color: #000; flex: 1; }
        .app-item .ai-cat { font-size: 8px; padding: 2px 8px; background: color-mix(in srgb, var(--section-color) 8%, transparent); color: var(--section-color); border-radius: 20px; font-family: 'Courier New', monospace; }
        .app-item .ai-size { font-size: 9px; color: #999; }
        .app-item select { font-size: 9px; padding: 2px 4px; border-radius: 4px; border: 1px solid color-mix(in srgb, var(--section-color) 20%, transparent); background: color-mix(in srgb, var(--section-color) 4%, transparent); color: var(--section-color); }
        .app-item .silent-label { font-size: 9px; color: #888; display: flex; align-items: center; gap: 3px; cursor: pointer; }
        .app-item .silent-label input { transform: scale(0.8); }

        #bundle-output { display: none; margin-top: 12px; padding: 14px; background: rgba(0,0,0,0.03); border-radius: 10px; font-family: 'Courier New', monospace; font-size: 11px; color: #333; max-height: 200px; overflow-y: auto; white-space: pre-wrap; }
        #bundle-warnings { margin-bottom: 8px; }
        #bundle-warnings > div { padding: 6px 10px; margin: 3px 0; font-size: 11px; background: color-mix(in srgb, var(--section-color) 6%, transparent); border-left: 2px solid var(--section-color); border-radius: 4px; animation: card-in 0.3s ease-out; }

        /* PRO TOOLS */
        .pro-tool-container { display: flex; flex-direction: column; gap: 18px; margin-top: 18px; }
        .pro-tool-card { background: color-mix(in srgb, var(--section-color) 4%, transparent); border: 1px solid color-mix(in srgb, var(--section-color) 15%, transparent); padding: 20px; border-radius: 14px; }
        .pro-tool-card h3 { margin: 0 0 8px; color: var(--section-color); font-family: 'Courier New', monospace; font-size: 14px; }
        .pro-input { width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid rgba(0,0,0,0.08); margin-bottom: 10px; font-family: inherit; font-size: 13px; box-sizing: border-box; }
        .pro-btn { background: var(--section-color); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; width: 100%; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); font-size: 12px; position: relative; overflow: hidden; }
        .pro-btn:hover { filter: brightness(0.85); transform: translateY(-2px); }
        .status-badge { display: inline-block; padding: 2px 8px; background: var(--section-color); color: #fff; font-size: 8px; border-radius: 4px; margin-bottom: 5px; letter-spacing: 1px; }

        /* APP MODAL */
        #app-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9998; padding: 20px; }
        #app-modal > div { width: 100%; height: 100%; background: #fff; border-radius: 12px; overflow: hidden; position: relative; }

                imgError: 'Не удалось загрузить изображение.', seoLoading: 'Анализ...',
                seoStatus: 'Статус', seoServer: 'Сервер', seoSsl: 'SSL', seoTime: 'Время',
                sslSecure: 'Безопасно', sslUnknown: 'Неизвестно',
                seoFailed: 'Анализ сервера не удался. Проверьте формат URL.',
                depWarning: '{dep} автоматически добавлено (зависимость {app})',
                catWarning: '{names} — несколько выборов в одной категории.',
                errFileNotFound: 'Файл не найден.', errTitle: 'Ошибка',
                online: 'ОНЛАЙН', download: 'СКАЧАТЬ', github: 'GITHUB',
                silent: 'Тихий', urlPlaceholder: 'https://example.com'

        };

        function t(key, ...args) {
            let s = (uiText[currentLang] && uiText[currentLang][key]) || key;
            args.forEach((a, i) => { s = s.replace(`{${i}}`, a); });
            return s;
        }

        function updateMenu() {
            document.querySelectorAll('.nav-link').forEach(l => {
                const p = l.dataset.page;
                const t = menuText[currentLang][p];
                const id = l.querySelector('.link-id');
                if (id) l.innerHTML = `${id.outerHTML} ${t}`;
            });
        }

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        const system = new TextParticleSystem();

        function getPoints(text, size) {
            const tc = document.createElement('canvas');
            const tx = tc.getContext('2d');
            tc.width = canvas.width; tc.height = canvas.height;
            tx.font = `bold ${size}px Inter, sans-serif`;
            tx.fillStyle = 'white'; tx.textAlign = 'center'; tx.textBaseline = 'middle';
            tx.fillText(text, tc.width / 2, tc.height / 2);
            const d = tx.getImageData(0, 0, tc.width, tc.height).data;
            const pts = [];
            for (let y = 0; y < tc.height; y += 3) {
                for (let x = 0; x < tc.width; x += 3) {
                    if (d[(y * tc.width + x) * 4 + 3] > 128) pts.push({ x, y });
                }
            }
            return pts;
        }

        const initialPts = getPoints("XGOETIA", Math.min(canvas.width / 6, 130));
        let activeCount = initialPts.length;
        initialPts.forEach(p => system.add_particle(
            Math.random() * canvas.width * 2 - canvas.width * 0.5,
            Math.random() * canvas.height * 2 - canvas.height * 0.5,
            p.x, p.y
        ));

        const codeEl = document.getElementById('code-stream');
        codeEl.textContent = [
            'use wasm_bindgen::prelude::*;',
            '',
            '#[wasm_bindgen]',
            'pub struct TextParticleSystem {',
            '    xs: Vec<f64>,',
            '    ys: Vec<f64>,',
            '    target_xs: Vec<f64>,',
            '    target_ys: Vec<f64>,',
            '    vxs: Vec<f64>,',
            '    vys: Vec<f64>,',
            '    radii: Vec<f64>,',
            '}',
            '',
            '#[wasm_bindgen]',
            'impl TextParticleSystem {',
            '    pub fn add_particle(&mut self, x: f64, y: f64, tx: f64, ty: f64) {',
            '        self.xs.push(x);',
            '        self.ys.push(y);',
            '        self.target_xs.push(tx);',
            '        self.target_ys.push(ty);',
            '        self.vxs.push(js_sys::Math::random() - 0.5);',
            '        self.vys.push(js_sys::Math::random() - 0.5);',
            '        self.radii.push(js_sys::Math::random() * 1.5 + 0.5);',
            '    }',
            '',
            '    pub fn update(&mut self, mx: f64, my: f64, r: f64, rx: f64, ry: f64, rw: f64, rh: f64) {',
            '        for i in 0..self.xs.len() {',
            '            let dx = mx - self.xs[i];',
            '            let dy = my - self.ys[i];',
            '            let dist_sq = dx * dx + dy * dy;',
            '            if dist_sq < r * r {',
            '                let dist = dist_sq.sqrt().max(0.1);',
            '                self.vxs[i] -= dx / dist * 5.0;',
            '                self.vys[i] -= dy / dist * 5.0;',
            '            }',
            '            if rw > 0.0 && self.xs[i] > rx - 20.0 && self.xs[i] < rx + rw + 20.0',
            '                && self.ys[i] > ry - 20.0 && self.ys[i] < ry + rh + 20.0 {',
            '                let mid_x = rx + rw / 2.0;',
            '                if self.xs[i] < mid_x { self.vxs[i] -= 1.5; }',
            '                else { self.vxs[i] += 1.5; }',
            '            }',
            '            let tdx = self.target_xs[i] - self.xs[i];',
            '            let tdy = self.target_ys[i] - self.ys[i];',
            '            self.vxs[i] += tdx * 0.15;',
            '            self.vys[i] += tdy * 0.15;',
            '            self.vxs[i] *= 0.85;',
            '            self.vys[i] *= 0.85;',
            '            self.xs[i] += self.vxs[i];',
            '            self.ys[i] += self.vys[i];',
            '        }',
            '    }',
            '',
            '    pub fn explode(&mut self, x: f64, y: f64, force: f64) {',
            '        for i in 0..self.xs.len() {',
            '            let dx = self.xs[i] - x;',
            '            let dy = self.ys[i] - y;',
            '            let dist_sq = dx * dx + dy * dy;',
            '            if dist_sq < 40000.0 {',
            '                let dist = dist_sq.sqrt().max(1.0);',
            '                let power = (1.0 - dist / 200.0) * force;',
            '                self.vxs[i] += (dx / dist) * power;',
            '                self.vys[i] += (dy / dist) * power;',
            '            }',
            '        }',
            '    }',
            '}'
        ].join('\n');

        function updateText(text) {
            const pts = getPoints(text.toUpperCase(), Math.min(canvas.width / 6, 130));
            const count = system.get_count();
            const txs = new Float64Array(memory.buffer, system.get_target_xs_ptr(), count);
            const tys = new Float64Array(memory.buffer, system.get_target_ys_ptr(), count);
            activeCount = pts.length;
            for (let i = 0; i < count; i++) {
                if (i < pts.length) { txs[i] = pts[i].x; tys[i] = pts[i].y; }
                else { txs[i] = -1000; tys[i] = -1000; }
            }
            for (let i = count; i < pts.length; i++) {
                system.add_particle(Math.random() * canvas.width, Math.random() * canvas.height, pts[i].x, pts[i].y);
            }
        }

        function setSection(page) {
            if (page === activeSection) return;
            activeSection = page;
            const text = menuText[currentLang][page];

        window.optimizeImage = function() {
            const input = document.getElementById('img-upload');
            const result = document.getElementById('img-result');
            if (!input || !input.files || !input.files[0]) return alert(t('selectImg'));
            result.style.display = 'block';
            result.innerHTML = t('imgProcessing');
            const file = input.files[0];
            const origSize = (file.size / 1024).toFixed(1);
            const img = new Image();
            img.onload = () => {
                const c = document.createElement('canvas');
                const maxDim = 1200;
                let w = img.width, h = img.height;
                if (w > maxDim || h > maxDim) {
                    const r = Math.min(maxDim / w, maxDim / h);
                    w = Math.round(w * r); h = Math.round(h * r);
                }
                c.width = w; c.height = h;
                const ctx = c.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);
                const quality = 0.7;
                const dataUrl = c.toDataURL('image/jpeg', quality);
                const b64len = dataUrl.length - 'data:image/jpeg;base64,'.length;
                const newSize = (b64len * 0.75 / 1024).toFixed(1);
                const link = document.createElement('a');
                link.download = 'optimized_' + file.name.replace(/\.[^.]+$/, '.jpg');
                link.href = dataUrl;
                link.textContent = t('download');
                result.innerHTML = t('imgSuccess', origSize, newSize) + '<br>';
                result.appendChild(link);
            };
            img.onerror = () => { result.innerHTML = t('imgError'); };
            img.src = URL.createObjectURL(file);
        };

                deps.forEach(d => {
                    const dep = document.querySelector('#apps-list input[data-name="' + d + '"]');
                    if (dep && !dep.checked) { dep.checked = true; warnings.push(t('depWarning', d, cb.dataset.name)); }
                });
            });
            Object.entries(cats).forEach(([cat, names]) => {
                if ((cat === 'Editor' || cat === 'Browser' || cat === 'Database') && names.length > 1) {
                    warnings.push(t('catWarning', names.join(', ')));
                }
            });
            document.getElementById('disk-space').textContent = totalSize + ' MB';
            const wd = document.getElementById('bundle-warnings');
            if (warnings.length) {
                wd.innerHTML = warnings.map(w => '<div>' + w + '</div>').join('');
                wd.style.display = 'block';
            } else { wd.style.display = 'none'; }
        }
        window.updateBundlerSelection = updateBundlerSelection;

        window.applyPreset = function(name) {
            const presets = {
                'Web Dev': ['VS Code', 'Node.js', 'Git', 'Chrome', 'Postman'],
                'DevOps': ['Docker', 'Git', 'Python', 'Rust'],
                'Database': ['MySQL', 'MongoDB', 'Node.js'],
                'Full Stack': ['VS Code', 'Node.js', 'Git', 'Docker', 'MongoDB', 'Chrome']
            };
            const apps = presets[name];
            if (!apps) return;
            document.querySelectorAll('#apps-list input[type="checkbox"]').forEach(cb => cb.checked = false);
            apps.forEach(a => {
                const cb = document.querySelector('#apps-list input[data-name="' + a + '"]');
                if (cb) cb.checked = true;
            });
            updateBundlerSelection();
        };

        window.selectAllApps = function(select) {
            document.querySelectorAll('#apps-list input[type="checkbox"]').forEach(cb => cb.checked = select);
            updateBundlerSelection();
        };

        window.openApp = function(url, name) {
            const modal = document.getElementById('app-modal');
            const frame = document.getElementById('app-frame');
            frame.src = url;
            modal.style.display = 'block';
            document.getElementById('app-modal-close').onclick = () => { modal.style.display = 'none'; frame.src = 'about:blank'; };
            modal.onclick = (e) => { if (e.target === modal) { modal.style.display = 'none'; frame.src = 'about:blank'; } };
        };

        let panelRect = { left: 0, top: 0, width: 0, height: 0 };
        function updatePanelRect() {
            if (pageContent.classList.contains('active')) {
                const r = pageContent.getBoundingClientRect();
                panelRect = { left: r.left, top: r.top, width: r.width, height: r.height };
            } else { panelRect = { left: 0, top: 0, width: 0, height: 0 }; }
        }

        // Animation with FPS control
        function animate(timestamp) {
            const minInterval = 1000 / targetFPS;
            if (timestamp - lastFrameTime < minInterval) { requestAnimationFrame(animate); return; }
            lastFrameTime = timestamp;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            try { system.update(mouseX, mouseY, 100, panelRect.left, panelRect.top, panelRect.width, panelRect.height); } catch (ex) { console.warn('system.update:', ex); }
            try {
                const count = system.get_count();
                if (count === 0) { requestAnimationFrame(animate); return; }
                const xs = new Float64Array(memory.buffer, system.get_xs_ptr(), count);
                const ys = new Float64Array(memory.buffer, system.get_ys_ptr(), count);
                const rs = new Float64Array(memory.buffer, system.get_radii_ptr(), count);
                ctx.fillStyle = sectionColorCache;
                for (let i = 0; i < count; i++) {
                    if (xs[i] > -999 && ys[i] > -999) {
                        ctx.beginPath();
                        ctx.arc(xs[i], ys[i], rs[i], 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            } catch (ex) { console.warn('render:', ex); }
            requestAnimationFrame(animate);
        }
        document.addEventListener('visibilitychange', () => { if (!document.hidden) requestAnimationFrame(animate); });

        updateMenu();
        const hc = getComputedStyle(document.documentElement).getPropertyValue('--color-hero').trim();
        if (hc) { document.documentElement.style.setProperty('--section-color', hc); sectionColorCache = hc; }
        document.getElementById('section-title').classList.add('active');
        requestAnimationFrame(animate);

    } catch(e) { console.error(e); }
}
run();
</script>
<script src="bundler-enhanced.js"></script>
</body>
</html>
